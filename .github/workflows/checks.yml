name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m compileall -q -x '(^|/)(venv|\.venv|\.git)(/|$)' .
      - name: Check extension manifest
        run: python -m json.tool frontend/manifest.json > /dev/null
      - name: Check JavaScript syntax
        run: node --check frontend/scripts/popup.js
